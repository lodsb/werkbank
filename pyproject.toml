[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "werkbank"
version = "0.1.0"
description = "Serial drivers and port discovery for bench instruments (Korad KA3005, OWON XDM1041)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pyserial>=3.5"]

[tool.setuptools.packages.find]
where = ["src"]
